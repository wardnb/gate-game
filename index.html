<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gate Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one full-screen canvas, HUD pinned top, support buttons pinned bottom, one card overlay for menu / results / pause,
     one full-height panel for the armory. Single military-poster theme by choice. */
  --navy:#14244f;
  --navy-deep:#0c1838;
  --olive:#4a5630;
  --red:#c8102e;
  --gold:#ffd23f;
  --accent:#d4a62a;
  --ink:#fff7ec;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy-deep);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#gl{pointer-events:none}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 62% at 50% 55%,rgba(0,0,0,0) 45%,rgba(8,14,36,1) 100%);opacity:.38}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none !important}

#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px 16px;pointer-events:none}
.chip{font-family:var(--display);font-size:16px;letter-spacing:.4px;background:rgba(20,36,79,.8);white-space:nowrap;
  border:2px solid rgba(255,247,236,.3);border-radius:999px;padding:5px 11px;min-height:36px;display:flex;align-items:center}
#pause,#mute{min-height:44px;min-width:44px;justify-content:center}
#medals{color:var(--gold)}
#pause{margin-left:auto}
#pause,#mute{pointer-events:auto;cursor:pointer}
#mute{font-family:var(--body);font-weight:800;font-size:12px}

#sup{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:8px;padding:0 16px}
#sup button{font-family:var(--display);font-size:15px;letter-spacing:.3px;color:#fff;background:var(--olive);border:2px solid var(--gold);
  border-radius:12px;padding:9px 12px;min-height:44px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);touch-action:none}
#sup button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
#sup button:disabled{opacity:.38;border-color:rgba(255,255,255,.3);cursor:default}

#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(12,20,48,.5)}
#card{width:100%;max-width:340px;background:var(--navy);border:3px solid rgba(255,247,236,.22);border-radius:22px;
  padding:24px 22px 20px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#card h1{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;color:var(--gold);
  text-wrap:balance;text-shadow:0 3px 0 rgba(0,0,0,.35);border-bottom:4px solid var(--accent);padding-bottom:10px}
#sub{font-family:var(--display);font-size:18px;letter-spacing:1px;color:#fff}
#stars{font-size:44px;line-height:1;color:var(--gold);letter-spacing:6px;animation:starpop .5s ease-out}
@keyframes starpop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
#msg{font-size:16px;line-height:1.45;font-weight:600}
#step{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.22);border-radius:14px;padding:6px}
#step button{font-family:var(--display);font-size:22px;width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,247,236,.3);
  background:rgba(255,255,255,.08);cursor:pointer}
#step button:disabled{opacity:.3;cursor:default}
#mlabel{font-family:var(--display);font-size:19px;letter-spacing:.4px}
#go{font-family:var(--display);font-size:24px;letter-spacing:.5px;color:var(--navy);background:var(--gold);
  border:0;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 5px 0 #b98d12}
#go:active{transform:translateY(3px);box-shadow:0 2px 0 #b98d12}
.ghost{font-family:var(--display);font-size:17px;letter-spacing:.4px;background:transparent;border:2px solid rgba(255,247,236,.4);
  border-radius:14px;padding:10px;cursor:pointer}
#branches{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.br{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:96px;padding:10px 6px;cursor:pointer;
  background:rgba(255,255,255,.06);border:2px solid rgba(255,247,236,.22);border-radius:14px;border-bottom:4px solid var(--ac)}
.br[aria-pressed="true"]{background:rgba(255,210,63,.14);border-color:var(--gold);border-bottom-color:var(--ac)}
.br i{width:30px;height:30px;border-radius:50%;background:var(--sw);border:4px solid var(--hl);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.br b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.br small{font-size:11px;font-weight:800;opacity:.75;font-style:italic;line-height:1.2}
#musbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:44px}
#musbtn small{font-family:var(--body);font-size:12px;font-weight:800;opacity:.75;letter-spacing:0}
#musbtn[aria-pressed="false"]{opacity:.7}
#fine{font-size:12px;opacity:.75;font-weight:600;line-height:1.5}

#base{position:absolute;inset:0;background:var(--navy-deep);overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
#base header{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-16px;background:var(--navy-deep);padding:12px 0 8px;z-index:1}
#base h2{font-family:var(--display);font-weight:400;font-size:28px;color:var(--gold)}
#bmedals{font-family:var(--display);font-size:18px;color:var(--gold)}
#base h3{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.5px;border-bottom:3px solid var(--accent);padding-bottom:4px;margin-top:6px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--navy);border:2px solid rgba(255,247,236,.16);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.row .rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row b{font-family:var(--display);font-weight:400;font-size:18px}
.row span{font-size:13px;font-weight:800;opacity:.8;white-space:nowrap}
.row p{font-size:14px;line-height:1.4;font-weight:600;opacity:.92}
.row.locked{opacity:.5}
.row button{font-family:var(--display);font-size:16px;color:var(--navy);background:var(--gold);border:0;border-radius:10px;padding:9px;min-height:42px;cursor:pointer}
.row button:disabled{background:rgba(255,255,255,.14);color:rgba(255,247,236,.6);cursor:default}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div id="hud">
    <span class="chip" id="lvl">Mission 1</span>
    <span class="chip" id="medals">Medals 0</span>
    <button class="chip" id="pause" type="button" aria-label="Pause">II</button>
    <button class="chip" id="mute" type="button">Sound on</button>
  </div>
  <div id="sup" hidden>
    <button type="button" id="s-drone">Drone</button>
    <button type="button" id="s-arty">Artillery</button>
    <button type="button" id="s-air">Air strike</button>
  </div>
  <div id="overlay">
    <div id="card">
      <h1 id="title">Gate Rush</h1>
      <p id="sub">Veterans Day Edition</p>
      <div id="stars" hidden></div>
      <p id="msg">Drag to steer. Your troops fire on their own.</p>
      <div id="step">
        <button type="button" id="prev" aria-label="Previous mission">&lsaquo;</button>
        <span id="mlabel">Mission 1</span>
        <button type="button" id="next" aria-label="Next mission">&rsaquo;</button>
      </div>
      <button id="go" type="button">Play</button>
      <div id="branches" hidden></div>
      <button id="basebtn" class="ghost" type="button">Armory and upgrades</button>
      <button id="brbtn" class="ghost" type="button">Branch: Army</button>
      <button id="musbtn" class="ghost" type="button" aria-pressed="true">Music: on</button>
      <button id="quit" class="ghost" type="button" hidden>Quit to menu</button>
      <span id="fine">Happy Veterans Day. Thank you to all who served.<br>No ads. No purchases. Progress stays on this device.</span>
    </div>
  </div>
  <div id="base" hidden>
    <header><h2>Armory</h2><span id="bmedals">0 medals</span></header>
    <button id="baseclose" class="ghost" type="button">Back</button>
    <h3>Upgrades</h3>
    <div class="list" id="upg"></div>
    <h3>Weapons found</h3>
    <div class="list" id="wlist"></div>
  </div>
</div>
<!-- If anything fails to start, say so on screen (players can't see the console) and offer the simple 2D mode. -->
<script>
window.onerror=function(m,src,line){
  try{var el=document.getElementById('msg');if(!el||window.__errShown)return;window.__errShown=1;
    var f=(src||'').split('/').pop().split('?')[0];
    el.innerHTML='Something went wrong loading the game ('+String(m).replace(/[<>&]/g,'')+(f?' at '+f+':'+line:'')+').'+
      ' <a href="?3d=off" style="color:#ffd23f">Try simple mode</a> or reload.';
    document.getElementById('overlay').hidden=false;}catch(e){}
};
/* only startup failures: once the game has run for a few seconds, leave the screen alone */
setTimeout(function(){window.__errShown=1;},8000);
</script>
<script src="js/a_core.js?v=20261111b"></script>
<script src="js/b_draw.js?v=20261111b"></script>
<script src="js/c_game.js?v=20261111b"></script>
<!-- 3D renderer. If it cannot load (offline, no WebGL) the game keeps drawing in 2D. -->
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script>
<script type="module" src="js/d_three.js?v=20261111b"></script>
</body>
</html>
